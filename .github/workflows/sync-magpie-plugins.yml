# sync-magpie-plugins.yml — 云端自动同步 magpie-plugin topic 仓库清单
# 每天 03:17（北京）由 GitHub Actions 运行：
#   1. GitHub API 搜索所有打了 magpie-plugin topic 标签的仓库
#   2. 与仓库内 plugin-manifest/manifest.json 对比，找出新增/更新仓库
#   3. 更新 manifest.json / manifest.csv，追加 sync-log.txt
#   4. 有变化时自动提交并推送到本仓库 main 分支（记录变更历史）
# 无需任何本地电脑/密钥：使用 Actions 自带的 GITHUB_TOKEN。
# 手动触发：仓库 Actions 页 Run workflow。

name: sync-magpie-plugins

on:
  schedule:
    # UTC 19:17 = 北京 03:17（每天），避开本地任务时段
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch magpie-plugin topic repos and update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request, os, datetime

          def gh(url):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # 1. 搜索全部 topic:magpie-plugin 仓库
          repos = []
          page = 1
          while True:
              data = gh(f"https://api.github.com/search/repositories?q=topic%3Amagpie-plugin&per_page=100&page={page}")
              repos += data.get("items", [])
              if len(data.get("items", [])) < 100:
                  break
              page += 1

          now = [{"name": r["full_name"], "clone": r["clone_url"], "branch": r["default_branch"],
                  "sizeKB": r["size"], "updated": r["updated_at"],
                  "desc": (r["description"] or "").replace("\n", " ").replace(",", ";")}
                 for r in repos]

          # 2. 与上次快照对比
          old = {}
          if os.path.exists("plugin-manifest/manifest.json"):
              with open("plugin-manifest/manifest.json", encoding="utf-8") as f:
                  old = {x["name"]: x["updated"] for x in json.load(f)}

          new_repos = [r for r in now if r["name"] not in old]
          upd_repos = [r for r in now if r["name"] in old and old[r["name"]] != r["updated"]]

          # 3. 更新清单
          os.makedirs("plugin-manifest", exist_ok=True)
          with open("plugin-manifest/manifest.json", "w", encoding="utf-8") as f:
              json.dump(now, f, ensure_ascii=False, indent=1)
          with open("plugin-manifest/manifest.csv", "w", encoding="utf-8") as f:
              for r in now:
                  f.write(f"{r['name']}|{r['clone']}|{r['branch']}|{r['sizeKB']}|{r['updated']}|{r['desc']}\n")

          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          lines = [f"[{stamp}] cloud sync: total={len(now)} new={len(new_repos)} updated={len(upd_repos)}"]
          for r in new_repos:
              lines.append(f"  + NEW  {r['name']}")
          for r in upd_repos:
              lines.append(f"  ~ UPD  {r['name']}  {old[r['name']]} -> {r['updated']}")
          with open("plugin-manifest/sync-log.txt", "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print("\n".join(lines))
          if new_repos or upd_repos:
              with open("plugin-manifest/.sync-dirty", "w") as f:
                  f.write("1")
          EOF

      - name: Commit and push
        run: |
          if [ -f plugin-manifest/.sync-dirty ]; then
            rm -f plugin-manifest/.sync-dirty
            git config user.name "dsh-model-full-bot"
            git config user.email "actions@github.com"
            git add plugin-manifest
            git commit -m "sync: magpie-plugin manifest (cloud, $(date -u +%Y-%m-%d))"
            git push
          else
            echo "no changes this run"
          fi
